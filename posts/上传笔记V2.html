      <!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>笔记板 · NoteBoard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    --bg: #0f0f13;
    --surface: #18181f;
    --surface2: #22222c;
    --border: #2e2e3a;
    --accent: #7c6af7;
    --accent2: #a78bfa;
    --text: #e8e8f0;
    --text-muted: #8888a0;
    --green: #4ade80;
    --red: #f87171;
    --card-bg: #1c1c26;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans SC', sans-serif;
    min-height: 100vh;
    padding-bottom: 60px;
  }

  /* ── Header ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 18px 32px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.1rem;
    font-weight: 500;
    color: var(--accent2);
    letter-spacing: 0.05em;
  }
  .logo span { color: var(--text-muted); }
  .header-meta {
    margin-left: auto;
    font-size: 0.78rem;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
  }

  /* ── Main layout ── */
  .container {
    max-width: 860px;
    margin: 0 auto;
    padding: 32px 20px;
  }

  /* ── Post composer ── */
  .composer {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 32px;
  }
  .composer h2 {
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 16px;
    font-family: 'JetBrains Mono', monospace;
  }
  .composer input[type="text"] {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--text);
    font-size: 0.95rem;
    font-family: 'Noto Sans SC', sans-serif;
    margin-bottom: 12px;
    outline: none;
    transition: border-color 0.2s;
  }
  .composer input[type="text"]:focus { border-color: var(--accent); }
  .composer input[type="text"]::placeholder { color: var(--text-muted); }

  .composer textarea {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    color: var(--text);
    font-size: 0.92rem;
    font-family: 'Noto Sans SC', sans-serif;
    resize: vertical;
    min-height: 100px;
    outline: none;
    transition: border-color 0.2s;
    line-height: 1.6;
  }
  .composer textarea:focus { border-color: var(--accent); }
  .composer textarea::placeholder { color: var(--text-muted); }

  .composer-actions {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 14px;
    flex-wrap: wrap;
  }

  .upload-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--surface2);
    border: 1px dashed var(--border);
    border-radius: 8px;
    padding: 8px 14px;
    color: var(--text-muted);
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  .upload-btn:hover { border-color: var(--accent); color: var(--accent2); }
  .upload-btn input { display: none; }

  .image-preview-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 12px;
  }
  .preview-thumb {
    position: relative;
    width: 72px;
    height: 72px;
  }
  .preview-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 6px;
    border: 1px solid var(--border);
  }
  .preview-thumb .remove-img {
    position: absolute;
    top: -6px;
    right: -6px;
    width: 18px;
    height: 18px;
    background: var(--red);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 10px;
    color: white;
    font-weight: bold;
  }

  .submit-btn {
    margin-left: auto;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px 24px;
    font-size: 0.9rem;
    font-family: 'Noto Sans SC', sans-serif;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    font-weight: 500;
  }
  .submit-btn:hover { background: var(--accent2); }
  .submit-btn:active { transform: scale(0.97); }

  /* ── Filter/Sort bar ── */
  .bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .post-count {
    font-size: 0.82rem;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
  }
  .sort-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-muted);
    font-size: 0.8rem;
    padding: 5px 12px;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    transition: all 0.2s;
  }
  .sort-btn:hover, .sort-btn.active { border-color: var(--accent); color: var(--accent2); }

  /* ── Post card ── */
  .post-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 22px;
    margin-bottom: 16px;
    transition: border-color 0.2s;
  }
  .post-card:hover { border-color: #3a3a4a; }

  .post-header {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 12px;
  }
  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #ec4899);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    font-weight: 700;
    color: white;
    flex-shrink: 0;
  }
  .post-meta { flex: 1; }
  .post-author {
    font-weight: 700;
    font-size: 0.92rem;
    color: var(--text);
  }
  .post-time {
    font-size: 0.75rem;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
    margin-top: 2px;
  }
  .post-title {
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 8px;
    line-height: 1.4;
  }
  .post-body {
    font-size: 0.9rem;
    color: #c0c0d0;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .post-images {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 14px;
  }
  .post-images img {
    max-width: 200px;
    max-height: 160px;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: transform 0.2s;
  }
  .post-images img:hover { transform: scale(1.02); }

  .post-footer {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }
  .like-btn, .reply-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 0.82rem;
    cursor: pointer;
    font-family: 'Noto Sans SC', sans-serif;
    padding: 4px 8px;
    border-radius: 6px;
    transition: all 0.2s;
  }
  .like-btn:hover { color: #f87171; background: rgba(248,113,113,0.08); }
  .like-btn.liked { color: #f87171; }
  .reply-toggle:hover { color: var(--accent2); background: rgba(124,106,247,0.08); }
  .delete-btn {
    margin-left: auto;
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 0.75rem;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
    font-family: 'JetBrains Mono', monospace;
    transition: all 0.2s;
  }
  .delete-btn:hover { color: var(--red); background: rgba(248,113,113,0.08); }

  /* ── Replies ── */
  .replies-section {
    margin-top: 14px;
    display: none;
  }
  .replies-section.open { display: block; }
  .reply-item {
    display: flex;
    gap: 10px;
    padding: 10px 0;
    border-top: 1px solid #1e1e28;
  }
  .reply-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: linear-gradient(135deg, #10b981, #3b82f6);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.7rem;
    font-weight: 700;
    color: white;
    flex-shrink: 0;
  }
  .reply-content { flex: 1; }
  .reply-author { font-size: 0.82rem; font-weight: 600; color: var(--text); }
  .reply-time { font-size: 0.72rem; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }
  .reply-text { font-size: 0.85rem; color: #b0b0c0; line-height: 1.6; margin-top: 3px; white-space: pre-wrap; word-break: break-word; }

  .reply-composer {
    display: flex;
    gap: 10px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid #1e1e28;
  }
  .reply-composer input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    color: var(--text);
    font-size: 0.85rem;
    font-family: 'Noto Sans SC', sans-serif;
    outline: none;
    transition: border-color 0.2s;
  }
  .reply-composer input:focus { border-color: var(--accent); }
  .reply-composer input::placeholder { color: var(--text-muted); }
  .reply-submit {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--accent2);
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 0.82rem;
    cursor: pointer;
    font-family: 'Noto Sans SC', sans-serif;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .reply-submit:hover { background: var(--accent); color: white; border-color: var(--accent); }

  /* ── Lightbox ── */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 999;
    align-items: center;
    justify-content: center;
  }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 8px; }
  .lightbox-close {
    position: absolute;
    top: 20px; right: 24px;
    color: white; font-size: 2rem;
    cursor: pointer; font-weight: 300;
    background: none; border: none;
  }

  /* ── Empty state ── */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
    font-size: 0.9rem;
  }
  .empty-icon { font-size: 2.5rem; margin-bottom: 12px; }

  /* ── QR Modal ── */
  .qr-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 999;
    align-items: center;
    justify-content: center;
  }
  .qr-modal.open { display: flex; }
  .qr-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 32px;
    text-align: center;
    min-width: 220px;
  }
  .qr-box h3 {
    font-size: 0.82rem;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
    margin-bottom: 16px;
    letter-spacing: 0.08em;
  }
  .qr-box img { width: 180px; height: 180px; border-radius: 8px; }
  .qr-loading {
    width: 180px; height: 180px;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-muted); font-size: 0.82rem;
    font-family: 'JetBrains Mono', monospace;
  }
  .qr-close {
    margin-top: 16px;
    background: none;
    border: 1px solid var(--border);
    color: var(--text-muted);
    border-radius: 8px;
    padding: 7px 20px;
    cursor: pointer;
    font-size: 0.82rem;
    font-family: 'Noto Sans SC', sans-serif;
    transition: all 0.2s;
  }
  .qr-close:hover { border-color: var(--accent); color: var(--accent2); }

  /* ── Toast ── */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--green);
    padding: 10px 22px;
    border-radius: 8px;
    font-size: 0.85rem;
    font-family: 'JetBrains Mono', monospace;
    opacity: 0;
    transition: all 0.3s;
    z-index: 200;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <div class="logo">note<span>//</span>board</div>
  <div class="header-meta" id="headerMeta">0 篇笔记</div>
</header>

<div class="container">

  <!-- Composer -->
  <div class="composer">
    <h2>// 发布笔记</h2>
    <input type="text" id="inputAuthor" placeholder="你的名字（可选，默认匿名）" maxlength="20">
    <input type="text" id="inputTitle" placeholder="标题（可选）" maxlength="60">
    <textarea id="inputBody" placeholder="写点什么……支持换行"></textarea>
    <div class="image-preview-row" id="previewRow"></div>
    <div class="composer-actions">
      <label class="upload-btn">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
        上传图片
        <input type="file" id="imgUpload" accept="image/*" multiple>
      </label>
      <span style="font-size:0.75rem;color:var(--text-muted)">支持多张</span>
      <button class="submit-btn" onclick="submitPost()">发布 →</button>
    </div>
  </div>

  <!-- Bar -->
  <div class="bar">
    <span class="post-count" id="postCount">共 0 篇</span>
    <div style="display:flex;gap:8px">
      <button class="sort-btn active" id="sortNew" onclick="setSort('new')">最新</button>
      <button class="sort-btn" id="sortLike" onclick="setSort('like')">最热</button>
    </div>
  </div>

  <!-- Feed -->
  <div id="feed"></div>

</div>

<!-- QR Modal -->
<div class="qr-modal" id="qrModal" onclick="closeQr()">
  <div class="qr-box" onclick="event.stopPropagation()">
    <h3>// 笔记二维码</h3>
    <div id="qrContent"><div class="qr-loading">生成中…</div></div>
    <button class="qr-close" onclick="closeQr()">关闭</button>
  </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">×</button>
  <img id="lightboxImg" src="" alt="">
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
  // ── State ──
  let posts = JSON.parse(localStorage.getItem('nb_posts') || '[]');
  let pendingImages = []; // {dataUrl, name}
  let sortMode = 'new';

  function save() {
    localStorage.setItem('nb_posts', JSON.stringify(posts));
  }

  // ── Image upload ──
  document.getElementById('imgUpload').addEventListener('change', function(e) {
    const files = Array.from(e.target.files);
    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = ev => {
        pendingImages.push({ dataUrl: ev.target.result, name: file.name });
        renderPreviews();
      };
      reader.readAsDataURL(file);
    });
    this.value = '';
  });

  function renderPreviews() {
    const row = document.getElementById('previewRow');
    row.innerHTML = '';
    pendingImages.forEach((img, i) => {
      const div = document.createElement('div');
      div.className = 'preview-thumb';
      div.innerHTML = `<img src="${img.dataUrl}" alt="${img.name}">
        <div class="remove-img" onclick="removeImg(${i})">×</div>`;
      row.appendChild(div);
    });
  }

  function removeImg(i) {
    pendingImages.splice(i, 1);
    renderPreviews();
  }

  // ── Submit post ──
  function submitPost() {
    const author = document.getElementById('inputAuthor').value.trim() || '匿名';
    const title  = document.getElementById('inputTitle').value.trim();
    const body   = document.getElementById('inputBody').value.trim();
    if (!body && pendingImages.length === 0) {
      showToast('请输入内容或上传图片', '#f87171'); return;
    }
    const post = {
      id: Date.now(),
      author,
      title,
      body,
      images: pendingImages.map(i => i.dataUrl),
      time: new Date().toISOString(),
      likes: 0,
      liked: false,
      replies: []
    };
    posts.unshift(post);
    save();
    // reset
    document.getElementById('inputAuthor').value = '';
    document.getElementById('inputTitle').value = '';
    document.getElementById('inputBody').value = '';
    pendingImages = [];
    renderPreviews();
    renderFeed();
    showToast('发布成功 ✓');
  }

  // ── Sort ──
  function setSort(mode) {
    sortMode = mode;
    document.getElementById('sortNew').classList.toggle('active', mode === 'new');
    document.getElementById('sortLike').classList.toggle('active', mode === 'like');
    renderFeed();
  }

  function getSorted() {
    const copy = [...posts];
    if (sortMode === 'like') copy.sort((a,b) => b.likes - a.likes);
    return copy;
  }

  // ── Like ──
  function toggleLike(id) {
    const p = posts.find(p => p.id === id);
    if (!p) return;
    p.liked = !p.liked;
    p.likes += p.liked ? 1 : -1;
    save();
    renderFeed();
  }

  // ── Delete ──
  function deletePost(id) {
    if (!confirm('确认删除这篇笔记？')) return;
    posts = posts.filter(p => p.id !== id);
    save();
    renderFeed();
    showToast('已删除', '#f87171');
  }

  // ── Reply ──
  function toggleReplies(id) {
    const sec = document.getElementById('replies-' + id);
    sec.classList.toggle('open');
    const btn = document.getElementById('replyToggle-' + id);
    const p = posts.find(p => p.id === id);
    btn.textContent = sec.classList.contains('open')
      ? `▲ 收起回复`
      : `💬 ${p.replies.length} 条回复`;
  }

  function submitReply(id) {
    const input = document.getElementById('replyInput-' + id);
    const text = input.value.trim();
    if (!text) return;
    const p = posts.find(p => p.id === id);
    p.replies.push({
      id: Date.now(),
      author: '匿名',
      text,
      time: new Date().toISOString()
    });
    save();
    input.value = '';
    renderFeed();
    // reopen replies
    setTimeout(() => {
      const sec = document.getElementById('replies-' + id);
      if (sec) sec.classList.add('open');
    }, 10);
  }

  // ── Lightbox ──
  function openLightbox(src) {
    document.getElementById('lightboxImg').src = src;
    document.getElementById('lightbox').classList.add('open');
  }
  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open');
  }

  // ── Render ──
  function formatTime(iso) {
    const d = new Date(iso);
    const now = new Date();
    const diff = (now - d) / 1000;
    if (diff < 60) return '刚刚';
    if (diff < 3600) return Math.floor(diff/60) + ' 分钟前';
    if (diff < 86400) return Math.floor(diff/3600) + ' 小时前';
    return d.toLocaleDateString('zh-CN', {month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
  }

  function getInitial(name) {
    return name.charAt(0).toUpperCase();
  }

  function renderFeed() {
    const feed = document.getElementById('feed');
    const sorted = getSorted();

    document.getElementById('postCount').textContent = `共 ${posts.length} 篇`;
    document.getElementById('headerMeta').textContent = `${posts.length} 篇笔记`;

    if (sorted.length === 0) {
      feed.innerHTML = `<div class="empty"><div class="empty-icon">📝</div>还没有笔记，来发第一篇吧</div>`;
      return;
    }

    feed.innerHTML = sorted.map(p => {
      const imagesHtml = p.images && p.images.length
        ? `<div class="post-images">${p.images.map(src =>
            `<img src="${src}" alt="图片" onclick="openLightbox('${src}')">`
          ).join('')}</div>`
        : '';

      const repliesHtml = p.replies.map(r => `
        <div class="reply-item">
          <div class="reply-avatar">${getInitial(r.author)}</div>
          <div class="reply-content">
            <div style="display:flex;align-items:baseline;gap:8px">
              <span class="reply-author">${escHtml(r.author)}</span>
              <span class="reply-time">${formatTime(r.time)}</span>
            </div>
            <div class="reply-text">${escHtml(r.text)}</div>
          </div>
        </div>
      `).join('');

      return `
      <div class="post-card" id="post-${p.id}">
        <div class="post-header">
          <div class="avatar">${getInitial(p.author)}</div>
          <div class="post-meta">
            <div class="post-author">${escHtml(p.author)}</div>
            <div class="post-time">${formatTime(p.time)}</div>
          </div>
        </div>
        ${p.title ? `<div class="post-title">${escHtml(p.title)}</div>` : ''}
        ${p.body ? `<div class="post-body">${escHtml(p.body)}</div>` : ''}
        ${imagesHtml}
        <div class="post-footer">
          <button class="like-btn ${p.liked?'liked':''}" onclick="toggleLike(${p.id})">
            ${p.liked ? '♥' : '♡'} ${p.likes}
          </button>
          <button class="reply-toggle" id="replyToggle-${p.id}" onclick="toggleReplies(${p.id})">
            💬 ${p.replies.length} 条回复
          </button>
          <button class="delete-btn" onclick="deletePost(${p.id})">删除</button>
          <button class="delete-btn" style="color:var(--accent2)" onclick="showQr(${p.id})">二维码</button>
        </div>
        <div class="replies-section" id="replies-${p.id}">
          ${repliesHtml}
          <div class="reply-composer">
            <input type="text" id="replyInput-${p.id}" placeholder="写回复…" maxlength="200"
              onkeydown="if(event.key==='Enter')submitReply(${p.id})">
            <button class="reply-submit" onclick="submitReply(${p.id})">回复</button>
          </div>
        </div>
      </div>`;
    }).join('');
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Toast ──
  function showToast(msg, color='#4ade80') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.color = color;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  // ── QR Code ──
  const QR_APP_ID     = 'ygbohlgjhurihtef';
  const QR_APP_SECRET = 'HPS87beaWG4nC4myN064PGs2bmJeyQYl';

  async function showQr(id) {
    const p = posts.find(p => p.id === id);
    if (!p) return;
    document.getElementById('qrContent').innerHTML = '<div class="qr-loading">生成中…</div>';
    document.getElementById('qrModal').classList.add('open');

    const content = encodeURIComponent(
      (p.title ? p.title + '\n' : '') + (p.body || '笔记 #' + id)
    );
    const url = `https://www.mxnzp.com/api/qrcode/create/single?content=${content}&size=300&type=0&app_id=${QR_APP_ID}&app_secret=${QR_APP_SECRET}`;

    try {
      const res = await fetch(url);
      const data = await res.json();
      if (data.code === 1 && data.data && data.data.qrCodeUrl) {
        document.getElementById('qrContent').innerHTML =
          `<img src="${data.data.qrCodeUrl}" alt="二维码">`;
      } else {
        document.getElementById('qrContent').innerHTML =
          `<div class="qr-loading" style="color:var(--red)">生成失败<br>${data.msg || ''}</div>`;
      }
    } catch(e) {
      document.getElementById('qrContent').innerHTML =
        `<div class="qr-loading" style="color:var(--red)">网络错误</div>`;
    }
  }

  function closeQr() {
    document.getElementById('qrModal').classList.remove('open');
  }

  // ── Init ──
  renderFeed();
</script>
