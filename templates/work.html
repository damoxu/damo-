{% extends "base.html" %}

{% set page_title = work.title %}

{% block content %}

  <article class="post">

    <header class="post-header">
      <h1 class="post-title">{{ work.title }}</h1>
      {% if work.link != "#" %}
        <a href="{{ work.link }}" class="work-link" target="_blank">查看项目 →</a>
      {% endif %}
    </header>

    <div class="post-body">
      {{ work.body | safe }}
    </div>

    <footer class="post-footer">
      <a href="/index.html">← 返回首页</a>
    </footer>

  </article>

{% endblock %}
