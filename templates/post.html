<!-- 继承 base.html，只需要填 content 块 -->
{% extends "base.html" %}

<!-- 设置这个页面的标题 -->
{% set page_title = post.title %}

{% block content %}

  <article class="post">

    <!-- 文章头部：标题、日期、标签 -->
    <header class="post-header">
      <h1 class="post-title">{{ post.title }}</h1>
      <div class="post-meta">
        <span class="post-date">{{ post.date }}</span>
        {% for tag in post.tags %}
          <span class="post-tag">{{ tag.strip() }}</span>
        {% endfor %}
      </div>
    </header>

    <!-- 文章正文：Markdown 已转成 HTML，用 safe 告诉 Jinja2 不要转义 -->
    <div class="post-body">
      {{ post.body | safe }}
    </div>

    <!-- 返回链接 -->
    <footer class="post-footer">
      <a href="/index.html">← 返回首页</a>
    </footer>

  </article>

{% endblock %}
