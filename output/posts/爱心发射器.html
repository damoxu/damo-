      <!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>爱心搜索框</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fff0f5;
      font-family: 'Microsoft YaHei', sans-serif;
      overflow: hidden;
    }

    h1 {
      font-size: 22px;
      color: #e0406a;
      margin-bottom: 28px;
      letter-spacing: 2px;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #fff;
      border: 2px solid #f4a0b5;
      border-radius: 50px;
      padding: 10px 20px;
      box-shadow: 0 4px 20px rgba(224,64,106,0.12);
      width: 360px;
      transition: border-color 0.3s;
    }

    .search-box:focus-within {
      border-color: #e0406a;
    }

    .search-box input {
      border: none;
      outline: none;
      font-size: 16px;
      color: #333;
      flex: 1;
      background: transparent;
    }

    .search-box .icon {
      font-size: 20px;
      color: #e0406a;
      cursor: pointer;
      user-select: none;
    }

    .hint {
      margin-top: 18px;
      font-size: 13px;
      color: #bbb;
      text-align: center;
    }

    .heart {
      position: fixed;
      font-size: 24px;
      pointer-events: none;
      animation: floatUp linear forwards;
      z-index: 9999;
      user-select: none;
    }

    @keyframes floatUp {
      0%   { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
      80%  { opacity: 0.8; }
      100% { opacity: 0; transform: translateY(-80vh) scale(1.5) rotate(30deg); }
    }

    #overlay {
      display: none;
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9998;
    }

    #overlay.active {
      display: block;
    }
  </style>
</head>
<body>

  <h1>💕 搜索框</h1>

  <div class="search-box">
    <span class="icon">🔍</span>
    <input type="text" id="searchInput" placeholder="输入关键词搜索..." autocomplete="off" />
  </div>

  <!-- <div class="hint">试试输入：杜益 · 520 · 许德思 · 王强 · 高原 · 吕逆顺</div> -->

  <div id="overlay"></div>

  <script>
    const keywords = ['杜益', '520', '许德思', '王强', '高原', '吕逆顺'];
    const hearts = ['❤️', '💕', '💖', '💗', '💓', '💘', '💝', '💞', '🩷'];

    let active = false;
    let timer = null;
    let burstTimer = null;

    const input = document.getElementById('searchInput');

    input.addEventListener('input', () => {
      const val = input.value;
      const matched = keywords.some(k => val.includes(k));

      if (matched && !active) {
        startHearts();
      } else if (!matched && active) {
        stopHearts();
      }
    });

    function startHearts() {
      active = true;
      burst(60);
      timer = setInterval(() => {
        for (let i = 0; i < 5; i++) {
          setTimeout(() => spawnHeart(), i * 80);
        }
      }, 300);
    }

    function stopHearts() {
      active = false;
      clearInterval(timer);
    }

    function burst(count) {
      for (let i = 0; i < count; i++) {
        setTimeout(() => spawnHeart(), i * 30);
      }
    }

    function spawnHeart() {
      const el = document.createElement('div');
      el.classList.add('heart');
      el.textContent = hearts[Math.floor(Math.random() * hearts.length)];

      const x = Math.random() * window.innerWidth;
      const y = window.innerHeight * (0.4 + Math.random() * 0.6);
      const size = 18 + Math.random() * 28;
      const dur = 2 + Math.random() * 2.5;

      el.style.left = x + 'px';
      el.style.top = y + 'px';
      el.style.fontSize = size + 'px';
      el.style.animationDuration = dur + 's';

      document.body.appendChild(el);
      setTimeout(() => el.remove(), dur * 1000);
    }
  </script>

</body>
</html>
