<!-- 继承 base.html，只需要填 content 块 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 页面标题：子模板可以覆盖 page_title 这个变量 -->
  <title>我的第一篇文章 - 我的博客</title>

  <link rel="stylesheet" href="/damo-/static/style.css">
</head>

<body>

  <!-- 顶部导航：每个页面都一样 -->
  <header class="site-header">
    <a href="/damo-/index.html" class="site-title">我的博客</a>
    <a href="/damo-/index.html">首页</a>
    <a href="/damo-/works/">作品集</a>
    <a href="/damo-/search.html">搜索</a>
    </nav>
  </header>

  <!-- 主体内容：由子模板填充 -->
  <main class="site-main">
    

  <article class="post">

    <!-- 文章头部：标题、日期、标签 -->
    <header class="post-header">
      <h1 class="post-title">我的第一篇文章</h1>
      <div class="post-meta">
        <span class="post-date">2024-01-01</span>
        
          <span class="post-tag">随笔</span>
        
          <span class="post-tag">开始</span>
        
      </div>
    </header>

    <!-- 文章正文：Markdown 已转成 HTML，用 safe 告诉 Jinja2 不要转义 -->
    <div class="post-body">
      <h1>你好，世界</h1>
<p>这是我的第一篇博客文章。</p>
<h2>为什么写博客</h2>
<ul>
<li>记录学习过程</li>
<li>整理自己的想法</li>
<li>分享给有需要的人</li>
</ul>
<h2>代码示例</h2>
<pre><code class="language-python">print(&quot;hello world&quot;)
</code></pre>
    </div>

    <!-- 返回链接 -->
    <footer class="post-footer">
      <a href="/damo-/index.html">← 返回首页</a>
    </footer>

  </article>


  </main>

  <!-- 底部 -->
  <footer class="site-footer">
    <p>© damoxu · 用 Python 和 Markdown 构建</p>
  </footer>

</body>
</html>
